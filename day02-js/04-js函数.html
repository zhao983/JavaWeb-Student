<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Js函数</title>
</head>

<body>

    <script>
        //1. 函数声明及调用 - 具名函数
        // 用function声明函数
        function add1(a, b) {
            return a + b;
        }

        let result1 = add1(10, 5);  //可以传入超过定义的参数，但超过的部分会被直接忽略掉
        console.log(result1);

        //2.匿名函数
        //2.1 函数表达式
        let add2 = function (a, b) {
            return a + b;
        }
        //直接用变量名来调用函数
        let result2 = add2(10, 5);
        console.log(result2);

        // 2.2箭头函数
        let add3 = (a, b) => {
            return a + b;
        }
        let result3 = add3(10, 5);
        console.log(result3);

    </script>
</body>

</html>
