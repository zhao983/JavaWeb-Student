<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Js中的DOM操作</title>
</head>

<body>
    <h1 id="title1">11111</h1>
    <h1>22222</h1>
    <h1>33333</h1>

    <script>
        //1.修改第一个h1标签中的文本内容
        //1.1 获取DOM对象
        let h1 = document.querySelector('#title1');
        // let h1 = document.querySelector('h1');  //获得第一个h1标签
        h1.innerHTML = '修改后的内容';

        let hs = document.querySelectorAll('h1');  //获取h1的节点列表，不是 JavaScript 的 Array。
        hs[1].innerHTML = '修改后的内容'
    </script>
</body>

</html>
