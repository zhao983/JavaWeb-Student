<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Js基础语法</title>
</head>
<body>
    <script>
        // 1. 变量声明 用let  
        let a = 20;
        // Js是弱类型的变量，一个变量可赋不同类型的值
        a = "Hello";
        alert(a);  //输出到弹框

        // 2.声明常量 const
        const PI = 3.14;
        // PI = 5  在编写的时候不报错，运行会报错

        console.log(a);  //输出到控制台
        document.write(a) //写道html页面中  不常用

    </script>
</body>
</html>
