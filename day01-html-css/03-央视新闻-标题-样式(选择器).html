<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 方式二 ：定义一个span标签 
        对当前内面生效
        -->
    <style>
        /* 元素选择器 优先级最低*/
        /* span{
            color: #999999;
        } */

        /* 类选择器 优先级第二*/
        .cls{
            color: #a82323;
        }

        /* ID选择器 同时选取同一个元素时，优先级最高*/
        #time{
            color: #999;
        }

        a{
        /* 去除超链接下面的下划线 */

            text-decoration: none;
        }
    </style>

    <!-- 方式三：外部样式 -->
     <!-- <link rel="stylesheet" href="css/news.css"> -->


    <title>上新不断、捷报频传 本周中国“硬核”成绩刷屏！</title>
</head>
<body>
    <!-- 定义一个标题 -->
    <h1>上新不断、捷报频传 本周中国“硬核”成绩刷屏！</h1>
    <!-- a 超链接标签：
     href：链接地址 - url地址
     target：打开方式
         _blank：新窗口打开
         _self：本窗口打开(默认)
    -->
    <a href="https://news.cctv.com/">央视网</a> 
    
    <!-- 方式三：外部样式 定义一个css文件-->
    <span class="cls" id="time">2026年10月11日 06:19:48</span>
    <!-- <span class="cls">类选择器</span> -->
     
</body>
</html>
